name: CI-CD Docker Deployment to ECS

on:
  push:
    branches:
      - lylia

jobs:
  docker-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-3

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build Docker image
      run: docker build -t timetracker .

    - name: Tag Docker image
      run: docker tag timetracker:latest 533612071251.dkr.ecr.eu-west-3.amazonaws.com/timetracker:latest

    - name: Push image to ECR
      run: docker push 533612071251.dkr.ecr.eu-west-3.amazonaws.com/timetracker:latest

    - name: Deploy to ECS
      run: |
        aws ecs update-service \
        --cluster timetracker-cluster \
        --service timetracker-service \
        --force-new-deployment
